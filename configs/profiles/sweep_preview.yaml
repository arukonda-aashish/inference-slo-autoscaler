# Single-replica capacity preview: 30s load steps, each followed by 20s idle so
# backlog from an overloaded step doesn't contaminate the next one.
# Target a replica directly (--url http://127.0.0.1:8001), not the router.
name: sweep_preview
seed: 3
phases:
  - {duration_s: 30, rate_rps: 4}
  - {duration_s: 20, rate_rps: 0}
  - {duration_s: 30, rate_rps: 6}
  - {duration_s: 20, rate_rps: 0}
  - {duration_s: 30, rate_rps: 8}
  - {duration_s: 20, rate_rps: 0}
  - {duration_s: 30, rate_rps: 10}
  - {duration_s: 20, rate_rps: 0}
  - {duration_s: 30, rate_rps: 12}
  - {duration_s: 20, rate_rps: 0}
  - {duration_s: 30, rate_rps: 14}
prompt_tokens:
  mixture:
    - {weight: 0.7, range: [100, 300]}
    - {weight: 0.3, range: [2000, 3500]}
max_tokens: {range: [64, 256]}