# Set from E1 on an RTX A5000: mu ~20 rps per replica (queue flat at 20 rps,
# unbounded at 40; ~18-20 completions/s at saturation).
# Baseline 0.4 x mu fits 1 replica; burst 1.7 x mu needs 2.
name: burst_gpu
seed: 42
phases:
  - {duration_s: 60, rate_rps: 8}
  - {duration_s: 30, rate_rps: 34}
  - {duration_s: 120, rate_rps: 8}
prompt_tokens:
  mixture:
    - {weight: 0.7, range: [100, 300]}
    - {weight: 0.3, range: [2000, 3500]}
max_tokens: {range: [64, 256]}
