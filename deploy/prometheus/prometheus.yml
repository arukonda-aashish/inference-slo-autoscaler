# Identical on the Mac and the GPU pod: every target is on 127.0.0.1.
global:
  scrape_interval: 2s   # the default 15s is far too coarse for events lasting tens of seconds
  scrape_timeout: 1s
  evaluation_interval: 2s

rule_files:
  - rules.yml

scrape_configs:
  - job_name: router
    static_configs:
      - targets: ["127.0.0.1:8000"]

  - job_name: replicas
    # Replicas come and go on dynamic ports, so they're discovered from a file.
    # Written by scripts/dev_mocks.sh for now, by the controller later.
    file_sd_configs:
      - files: ["targets/replicas.json"]
        refresh_interval: 5s